<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Off-grid</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      text-align: center;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* HEADER */
    .header {
      display: flex;
      align-items: center;
      padding: 20px 40px;
      height: 100px;
      box-sizing: border-box;
      flex: 0 0 100px;
      position: relative;
      z-index: 1;
      background: #fff;
    }

    .header img {
      height: 60px;
    }

    .header h1 {
      margin: 0 0 0 40px;
      font-size: 32px;
    }

    .image-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: repeat(2, minmax(0, 1fr));
      align-items: center;
      justify-items: center;
      width: 100%;
      flex: 1 1 0;
      min-height: 0;
      grid-gap: 10px;
      gap: 10px;
      padding: 0 10px 10px;
      box-sizing: border-box;
    }

    .image-grid img {
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      object-position: center;
      min-width: 0;
      min-height: 0;
    }

  </style>
</head>

<body>

  <div class="header">
    <img src="/static/image/axis_logo.png" alt="Axis Logo">
    <h1>Off-grid power station + 5G Backbox</h1>
  </div>

  <div class="image-grid">
    <img src="/static/image/off-grid-1.jpg" alt="Off-grid image 1">
    <img src="/static/image/off-grid-2.jpg" alt="Off-grid image 2">
    <img src="/static/image/off-grid-3.jpg" alt="Off-grid image 3">
    <img src="/static/image/off-grid-4.jpg" alt="Off-grid image 4">
  </div>

</body>
</html>
