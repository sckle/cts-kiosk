<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>GitHub Copilot Agent Tour</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    /* HEADER */
    .header {
      display: flex;
      align-items: center;
      padding: 20px 40px;
    }

    .header img {
      height: 60px;
    }

    .header h1 {
      margin-left: 40px;
      font-size: 32px;
    }

    /* IMAGE CONTAINER */
    .image-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      height: calc(100vh - 120px);
      overflow: hidden;
    }

    .image-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
</head>

<body>

  <div class="header">
    <img src="/static/image/axis_logo.png" alt="Axis Logo">
    <h1>GitHub Copilot Agent Tour: Model, Mode, and Permissions</h1>
  </div>

  <div class="image-wrapper">
    <img src="/static/image/copilot-agent-tour.svg" alt="GitHub Copilot agent tour: model, agent mode and permissions">
  </div>

</body>
</html>
